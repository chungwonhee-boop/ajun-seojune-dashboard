<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>👑 아준이 서준이네 가족 대시보드</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="아준서준 대시보드">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="application-name" content="아준서준 대시보드">
<meta name="theme-color" content="#f6efe1">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="apple-touch-icon.png">
<style>
:root{
  --paper:#f6efe1; --paper2:#efe5d0; --card:#fffdf8; --ink:#4a4234; --ink2:#8a7f6a;
  --line:#e4dac4; --gold:#c9a227; --accent:#c0392b;
  --ajun:#e8833a; --ajun-soft:#fdeee1;
  --seojun:#4f8fd0; --seojun-soft:#e5effa;
  --wish:#d46a9c; --wish-soft:#fbeaf3;
  --cal:#7a9e6b; --cal-soft:#eaf2e5;
  --green:#3f9d63; --red:#c94f4f;
  --shadow:0 2px 10px rgba(90,70,30,.10), 0 8px 24px rgba(90,70,30,.07);
}
*{box-sizing:border-box; margin:0; padding:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","맑은 고딕",system-ui,sans-serif;
  background:
    radial-gradient(circle at 12% 8%, rgba(201,162,39,.07), transparent 30%),
    radial-gradient(circle at 88% 92%, rgba(79,143,208,.06), transparent 30%),
    repeating-linear-gradient(45deg, rgba(160,130,60,.025) 0 14px, transparent 14px 28px),
    var(--paper);
  color:var(--ink); min-height:100vh;
}
button{font-family:inherit; cursor:pointer; border:none; background:none; color:inherit}
input,select{font-family:inherit; font-size:13px; color:var(--ink); background:#fff; border:1.5px solid var(--line); border-radius:9px; padding:7px 9px; outline:none}
input:focus,select:focus{border-color:var(--gold)}
.hidden{display:none !important}

/* ===== header ===== */
header{
  position:sticky; top:0; z-index:30;
  display:flex; align-items:center; gap:14px; flex-wrap:wrap;
  padding:12px 20px;
  background:linear-gradient(180deg,#fffdf6 0%, #faf3e2 100%);
  border-bottom:1px solid var(--line); box-shadow:0 2px 12px rgba(90,70,30,.08);
}
.h-title{display:flex; flex-direction:column; gap:2px}
.h-title h1{font-size:20px; letter-spacing:-.3px}
.h-clock{font-size:12.5px; color:var(--ink2); font-variant-numeric:tabular-nums}
.h-space{flex:1}
.h-btn{
  display:inline-flex; align-items:center; gap:6px;
  background:#fff; border:1.5px solid var(--line); border-radius:999px;
  padding:8px 14px; font-size:13px; font-weight:600; box-shadow:0 1px 4px rgba(90,70,30,.08);
  transition:transform .1s, box-shadow .1s;
}
.h-btn:hover{transform:translateY(-1px); box-shadow:0 3px 8px rgba(90,70,30,.14)}

/* ===== layout ===== */
main{
  max-width:1560px; margin:0 auto; padding:18px;
  display:grid; grid-template-columns:minmax(270px,315px) minmax(0,1fr) minmax(0,1fr) minmax(270px,315px);
  gap:16px; align-items:start;
}
@media (max-width:1250px){
  main{grid-template-columns:1fr 1fr}
}
@media (max-width:740px){
  main{grid-template-columns:1fr; padding:12px}
  header{padding:10px 14px}
  .h-title h1{font-size:17px}
}
.col{
  background:var(--card); border:1px solid var(--line); border-radius:16px;
  box-shadow:var(--shadow); padding:16px; position:relative; overflow:hidden;
}
.col-kid{border-top:5px solid var(--ajun)}
.col-kid.k-seojun{border-top-color:var(--seojun)}
.col-kid.k-ajun .sec-title{color:var(--ajun)}
.col-kid.k-seojun .sec-title{color:var(--seojun)}

.sec-title{font-size:15px; font-weight:800; display:flex; align-items:center; gap:6px; letter-spacing:-.2px}
.sec-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; gap:8px; flex-wrap:wrap}
.mini-btn{
  font-size:11.5px; font-weight:700; color:var(--ink2);
  border:1px solid var(--line); background:#fbf7ee; border-radius:999px; padding:4px 10px;
}
.mini-btn:hover{color:var(--ink); border-color:#d5c8a8}

/* ===== calendar ===== */
.cal-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:8px}
.cal-head .ym{font-size:14.5px; font-weight:800}
.cal-nav{display:flex; gap:4px}
.cal-nav button{
  width:28px; height:28px; border-radius:8px; border:1px solid var(--line); background:#fbf7ee;
  font-size:13px; font-weight:800; color:var(--ink2);
}
.cal-nav button.cal-today{width:auto; padding:0 10px; font-size:11.5px}
.cal-nav button:hover{background:#f3ead6}
.cal-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:2px; text-align:center}
.cal-dow{font-size:11px; color:var(--ink2); padding:4px 0; font-weight:700}
.cal-dow.sun{color:var(--red)} .cal-dow.sat{color:#4f76a0}
.cal-cell{
  position:relative; font-size:12.5px; padding:6px 0 13px; border-radius:8px; min-height:40px;
  font-variant-numeric:tabular-nums;
}
.cal-cell:not(.dim){cursor:pointer}
.cal-cell:not(.dim):hover{background:#f5eeda}
.cal-cell.dim{color:#c9bfa8; cursor:pointer}
.cal-cell.dim:hover{background:#f7f2e4}
.cal-cell.sun{color:var(--red)} .cal-cell.sat{color:#4f76a0}
.cal-cell.today{background:#f7edd3; font-weight:800; box-shadow:inset 0 0 0 1.5px var(--gold)}
.cal-cell.sel{background:var(--cal-soft); font-weight:800; outline:2.5px solid var(--cal); outline-offset:-2px}
.cal-cell.today.sel{background:linear-gradient(180deg,#f7edd3,#e9f2e2)}
.cal-dots{position:absolute; left:0; right:0; bottom:3px; display:flex; gap:2.5px; justify-content:center; align-items:center; pointer-events:none}
.cal-dots i{display:block; width:5px; height:5px; border-radius:50%; background:var(--accent)}
.cal-dots i.fam{background:var(--cal)} .cal-dots i.ajun{background:var(--ajun)} .cal-dots i.seojun{background:var(--seojun)}

/* ===== 선택한 날짜 일정 패널 ===== */
.day-panel{margin-top:11px; border:1.5px solid #c7dbbe; border-radius:13px; background:var(--cal-soft); padding:10px 11px}
.dp-head{display:flex; align-items:center; justify-content:space-between; gap:8px}
.dp-title{font-size:13.5px; font-weight:800; color:#4d6b45; display:flex; align-items:center; gap:6px; flex-wrap:wrap}
.dp-today{font-size:10px; font-weight:800; color:#fff; background:var(--cal); border-radius:999px; padding:2px 7px}
.dp-list{display:flex; flex-direction:column; gap:5px; margin-top:8px}
.dp-item{display:flex; align-items:center; gap:7px; background:#fff; border:1px solid #d7e3cf; border-radius:10px; padding:6px 8px}
.dp-item .tm{font-size:11.5px; font-weight:800; color:#5d7a52; font-variant-numeric:tabular-nums; white-space:nowrap; flex:none}
.dp-item .tm.all{color:#9aa98f}
.dp-item .lb{flex:1; min-width:0; font-size:12.5px; font-weight:600; word-break:break-all}
.who-b{font-size:10px; font-weight:800; color:#fff; border-radius:999px; padding:2px 7px; flex:none}
.who-b.ajun{background:var(--ajun)} .who-b.seojun{background:var(--seojun)} .who-b.fam{background:var(--cal)}
.dp-empty{font-size:11.5px; color:#8ba07e; padding:6px 2px}
.dp-dday{font-size:11.5px; font-weight:800; color:#a3402f; background:#fdeeea; border:1px dashed #e6bdb1; border-radius:9px; padding:5px 9px; margin-top:7px; display:flex; gap:5px}
.dp-form{margin-top:9px; align-items:center}
.dp-form select{flex:0 0 74px}
.dp-form input[type="time"]{flex:0 0 106px; min-width:0}
.dp-form input[type="text"]{flex:1 1 96px; min-width:0}
@media (max-width:740px){
  .form-row.dp-form{display:grid; grid-template-columns:70px 100px auto; gap:6px; align-items:center}
  .dp-form #ev-who{grid-area:1/1/2/2; width:100%}
  .dp-form #ev-time{grid-area:1/2/2/3; width:100%}
  .dp-form .add-btn{grid-area:1/3/2/4; justify-self:start}
  .dp-form #ev-title{grid-area:2/1/3/4; width:100%}
}

/* ===== dday ===== */
.dday-list{display:flex; flex-direction:column; gap:7px; margin-top:6px}
.dday-item{
  display:flex; align-items:center; gap:9px; background:#fbf7ee;
  border:1px solid var(--line); border-radius:11px; padding:8px 10px;
}
.dday-item .ic{font-size:16px}
.dday-item .t{flex:1; min-width:0}
.dday-item .t b{display:block; font-size:13px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.dday-item .t span{font-size:11px; color:var(--ink2)}
.dday-badge{
  font-size:11.5px; font-weight:800; color:#fff; background:var(--cal);
  border-radius:999px; padding:3px 9px; white-space:nowrap; font-variant-numeric:tabular-nums;
}
.dday-badge.d0{background:var(--red)} .dday-badge.past{background:#b9ae95}
.x-del{
  width:20px; height:20px; border-radius:6px; color:#b6ab92; font-size:14px; line-height:1;
  flex:none; display:inline-flex; align-items:center; justify-content:center;
}
.x-del:hover{color:var(--red); background:#f7e3e3}
.form-row{display:flex; gap:6px; margin-top:9px; flex-wrap:wrap}
.form-row input{flex:1; min-width:0}
.add-btn{
  background:var(--cal); color:#fff; font-weight:800; border-radius:9px; padding:7px 13px; font-size:13px;
  flex:none;
}
.add-btn:hover{filter:brightness(1.07)}
.add-btn.orange{background:var(--ajun)} .add-btn.blue{background:var(--seojun)} .add-btn.pink{background:var(--wish)}

/* ===== kid card ===== */
.kid-top{display:flex; gap:12px; align-items:center}
.kid-badge{flex:none; filter:drop-shadow(0 3px 5px rgba(90,70,30,.25))}
.kid-id{flex:1; min-width:0}
.kid-name-row{display:flex; align-items:center; gap:7px; flex-wrap:wrap}
.kid-name{font-size:18px; font-weight:900; letter-spacing:-.3px}
.lvl-chip{
  font-size:11.5px; font-weight:800; color:#fff; border-radius:999px; padding:3px 10px;
  background:linear-gradient(135deg,#c9a227,#e6c25a); box-shadow:0 1px 4px rgba(160,120,20,.3);
}
.kid-memo{
  font-size:11.5px; color:var(--ink2); margin-top:3px; cursor:pointer; border-bottom:1px dashed #cfc4a8;
  display:inline-block; max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.kid-memo:hover{color:var(--ink)}
.xp-row{display:flex; align-items:center; gap:8px; margin-top:9px}
.xp-bar{flex:1; height:12px; border-radius:999px; background:#efe7d3; overflow:hidden; box-shadow:inset 0 1px 3px rgba(90,70,30,.15)}
.xp-fill{height:100%; border-radius:999px; background:linear-gradient(90deg,#e6c25a,#c9a227); transition:width .5s cubic-bezier(.2,.8,.3,1)}
.k-ajun .xp-fill{background:linear-gradient(90deg,#f5b26b,#e8833a)}
.k-seojun .xp-fill{background:linear-gradient(90deg,#79b0e4,#4f8fd0)}
.xp-num{font-size:11.5px; font-weight:800; color:var(--ink2); font-variant-numeric:tabular-nums; white-space:nowrap}
.dex-row{display:flex; align-items:center; gap:6px; margin-top:7px; flex-wrap:wrap}
.dex-label{font-size:11px; font-weight:800; color:var(--ink2)}
.dex-dots{display:flex; gap:3px; flex-wrap:wrap}
.dex-dot{
  width:17px; height:17px; border-radius:5px; font-size:9px; font-weight:800;
  display:inline-flex; align-items:center; justify-content:center;
  background:#efe7d3; color:#c0b498; border:1px solid #e4dac4;
}
.dex-dot.on{background:linear-gradient(135deg,#e6c25a,#c9a227); color:#fff; border-color:#b08d1c}
.next-rank{font-size:11px; color:var(--ink2); margin-top:6px}
.next-rank b{color:var(--gold)}

/* sections inside kid card */
.sub-sec{border-top:1.5px dashed var(--line); margin-top:14px; padding-top:12px}

/* schedule today */
.sched-list{display:flex; flex-direction:column; gap:4px; margin-top:8px}
.sched-item{display:flex; align-items:baseline; gap:8px; font-size:12.5px; padding:4px 8px; border-radius:8px; background:#fbf7ee}
.sched-item .tm{font-weight:800; color:var(--ink2); font-variant-numeric:tabular-nums; white-space:nowrap; font-size:11.5px}
.k-ajun .sched-item .tm{color:var(--ajun)} .k-seojun .sched-item .tm{color:var(--seojun)}
.sched-item .lb{flex:1}
.sched-item .tm.all{color:#9aa98f; font-weight:700}
.sched-empty{font-size:12px; color:var(--ink2); padding:6px 2px}
.sched-now{box-shadow:inset 0 0 0 1.5px var(--gold); background:#fdf6e0}
.sched-item.sp{background:#f2f7ec; box-shadow:inset 0 0 0 1px #dae7d0}
.sched-item.dday{background:#fdf1ec; box-shadow:inset 0 0 0 1px #f0cfc4}
.sched-badge{font-size:9.5px; font-weight:800; border-radius:999px; padding:2px 6px; flex:none; white-space:nowrap; letter-spacing:-.2px}
.sched-badge.ev{color:#3f6b34; background:#dcecd2}
.sched-badge.dd{color:#a3402f; background:#fbdcd3}

/* quests */
.q-head{display:flex; align-items:center; gap:7px; flex-wrap:wrap}
.q-count{font-size:12.5px; font-weight:800; color:var(--ink2); font-variant-numeric:tabular-nums}
.joker-chip{
  font-size:10.5px; font-weight:800; border-radius:999px; padding:3px 9px;
  background:#f1e8d2; color:#9a8b64; border:1px dashed #d5c8a8;
}
.joker-chip.got{background:#e9f6ee; color:var(--green); border:1px solid #bfe2cd}
.joker-chip.off{background:#f7efe4; color:#a89a7d; border-color:#e4dac4}
.q-list{display:flex; flex-direction:column; gap:6px; margin-top:9px}
.q-item{border:1px solid var(--line); border-radius:11px; background:#fff; overflow:visible; position:relative}
.q-item.done{background:#f3f6ef}
.q-main{display:flex; align-items:center; gap:7px; padding:8px 8px 8px 10px; flex-wrap:wrap}
.q-check{
  width:22px; height:22px; border-radius:50%; border:2px solid #d5c8a8; flex:none;
  display:inline-flex; align-items:center; justify-content:center; font-size:12px; color:#fff; font-weight:900;
  transition:background .15s, border-color .15s;
}
.q-item.done .q-check{background:var(--green); border-color:var(--green)}
.q-title{flex:1 1 88px; min-width:0; font-size:13px; font-weight:600; cursor:default}
.q-item.done .q-title{color:#a9a08a; text-decoration:line-through}
.q-xp{font-size:11px; font-weight:800; color:var(--gold); white-space:nowrap}
.q-goal{font-size:10.5px; font-weight:700; color:var(--ink2); background:#f5efdf; border-radius:999px; padding:2px 8px; white-space:nowrap; font-variant-numeric:tabular-nums}
.q-goal.full{background:#e9f6ee; color:var(--green)}
.q-item.rest{background:#faf7ef; border-style:dashed; opacity:.75}
/* 미완료(−절반 감점) 상태 */
.q-item.miss{background:#fdf2ec; border-color:#ecc7b6}
.q-item.miss .q-title{color:#a8694e}
.q-item.miss .q-goal{background:#f6e3d9; color:#a8694e}
.q-item.miss .q-check{border-color:#e0b7a3}
.q-item.miss .q-xp{color:#c08a74; text-decoration:line-through}
.q-miss{
  font-size:11px; font-weight:800; color:#a05a3e; background:#fdf4ee;
  border:1px solid #eccbba; border-radius:999px; padding:2px 8px; flex:none;
  font-variant-numeric:tabular-nums; line-height:1.45; white-space:nowrap;
  transition:background .15s, color .15s, border-color .15s;
}
.q-miss:hover{background:#f8e2d6; border-color:#dca98e; color:#8b4429}
.q-item.miss .q-miss{background:#c4603c; border-color:#c4603c; color:#fff}
.q-miss-note{font-size:11px; font-weight:800; color:#b4522f; padding:0 10px 7px 39px; font-variant-numeric:tabular-nums}
.today-net{
  font-size:11.5px; font-weight:800; border-radius:999px; padding:2.5px 9px;
  font-variant-numeric:tabular-nums; white-space:nowrap;
}
.today-net.pos{color:#2f7d4d; background:#e9f6ee; border:1px solid #c4e4d1}
.today-net.neg{color:#b4462f; background:#fbe7df; border:1px solid #f0cdbe}
.today-net.zero{color:#8a7f6a; background:#f2ece0; border:1px solid #e4dac4}
.miss-chip{font-size:10.5px; font-weight:800; color:#b4462f; background:#fbe7df; border-radius:999px; padding:2px 8px; white-space:nowrap}
.q-rest-ic{display:inline-flex; align-items:center; justify-content:center; font-size:13px; width:22px; height:22px; flex:none}
.q-set{width:22px;height:22px;border-radius:6px;color:#c2b698;font-size:12px;display:inline-flex;align-items:center;justify-content:center;flex:none}
.q-set:hover{background:#f5efdf; color:var(--ink)}
.q-settings{border-top:1px dashed var(--line); padding:8px 10px; background:#fbf8f0; display:flex; flex-direction:column; gap:7px}
.chips{display:flex; gap:4px; flex-wrap:wrap; align-items:center}
.chips .cl{font-size:10.5px; color:var(--ink2); font-weight:700; margin-right:2px}
.chip{
  width:26px; height:24px; border-radius:7px; font-size:11px; font-weight:800;
  border:1px solid var(--line); background:#fff; color:#b6ab92;
}
.chip.on{background:var(--cal); border-color:var(--cal); color:#fff}
.q-rest{font-size:11px; color:#9a8b64; background:#f5efdf; border-radius:9px; padding:6px 10px; margin-top:8px}
.q-rest b{color:#7a6c45}

/* wish */
.wish-list{display:flex; flex-direction:column; gap:7px; margin-top:9px}
.wish-item{display:flex; align-items:flex-start; gap:9px; border:1px solid var(--line); border-radius:11px; padding:9px 10px; background:#fff}
.wish-item.done{background:#f3f6ef}
.w-check{
  width:22px; height:22px; border-radius:50%; border:2px solid #d5c8a8; flex:none; margin-top:1px;
  display:inline-flex; align-items:center; justify-content:center; font-size:12px; color:#fff; font-weight:900;
}
.wish-item.done .w-check{background:var(--green); border-color:var(--green)}
.w-body{flex:1; min-width:0}
.w-title{font-size:13px; font-weight:700; word-break:break-all}
.wish-item.done .w-title{text-decoration:line-through; color:#a9a08a}
.w-memo{font-size:11.5px; color:var(--ink2); margin-top:2px}
.w-who{font-size:10.5px; font-weight:800; color:#fff; border-radius:999px; padding:2.5px 8px; flex:none; margin-top:1px}
.w-who.ajun{background:var(--ajun)} .w-who.seojun{background:var(--seojun)} .w-who.family{background:var(--wish)}
.wish-guide{font-size:12px; color:var(--ink2); background:var(--wish-soft); border-radius:10px; padding:9px 11px; margin-bottom:4px}
.wish-empty{font-size:12px; color:#b6ab92; text-align:center; padding:14px 0}
.who-badge-wrap{display:flex; align-items:center; gap:8px; flex:1; min-width:0; flex-wrap:wrap}

/* ===== modals ===== */
.modal{position:fixed; inset:0; z-index:60; display:flex; align-items:center; justify-content:center; padding:18px}
.modal-bg{position:absolute; inset:0; background:rgba(60,48,25,.45)}
.modal-card{
  position:relative; background:var(--card); border-radius:18px; box-shadow:0 20px 60px rgba(50,40,15,.35);
  max-width:680px; width:100%; max-height:88vh; overflow:auto; padding:20px;
}
.modal-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:12px}
.modal-head h2{font-size:17px}
.modal-close{
  width:30px; height:30px; border-radius:9px; border:1px solid var(--line); background:#fbf7ee;
  font-size:15px; font-weight:800; color:var(--ink2);
}
.rank-row{
  display:flex; align-items:center; gap:12px; padding:9px 10px; border:1px solid var(--line);
  border-radius:12px; margin-bottom:7px; background:#fffdf8;
}
.rank-row .rk-name{font-size:13.5px; font-weight:800}
.rank-row .rk-name small{font-weight:700; color:var(--gold); margin-right:5px}
.rank-row .rk-desc{font-size:11.5px; color:var(--ink2); margin-top:2px; line-height:1.45}
.rank-row.top{background:linear-gradient(135deg,#fff8dc,#fdf0c2); border-color:#dfb94a}
.rank-cond{
  font-size:10.5px; font-weight:800; color:#8a6508; background:#fdf4da; border-radius:999px;
  padding:3px 9px; white-space:nowrap;
}
.rk-right{flex:none; text-align:right}

/* ---------- 버전 마이그레이션 (v1 → v2) ----------
   이전에 저장된 데이터가 남아 있어도 새 퀘스트 기본값·새 계급 기준이 적용되도록 함.
   XP·계급 도감·시간표·D-Day·위시리스트·메모는 그대로 유지하고,
   퀘스트 목록만 “v1 기본값 그대로”인 경우에만 v2 균형 퀘스트로 교체. */
function migrate(st){
  var from = st.v || 1;
  if(from >= SCHEMA_VERSION){ st.v = SCHEMA_VERSION; return st; }
  var fresh = defaultState();
  (st.kids||[]).forEach(function(k){
    var def = fresh.kids.filter(function(x){ return x.id===k.id; })[0];
    if(!def) return;
    var titles = (k.quests||[]).map(function(q){ return q.title; });
    var v1 = V1_QUEST_TITLES[k.id] || [];
    var untouched = titles.length>0 && titles.every(function(t){ return v1.indexOf(t)>=0; });
    if(untouched) k.quests = def.quests;
  });
  st.v = SCHEMA_VERSION;
  return st;
}

/* 오늘 요일 기준: 활성/휴식 퀘스트 분리, 지난날 체크 해제 */
function normalizeDay(){
  var t = todayStr();
  if(S.lastDate !== t){
    S.kids.forEach(function(k){
      k.quests.forEach(function(q){
        if(q.doneDate !== t){ q.done = false; q.doneDate = null; }
        q.doneAmt = q.done ? (q.doneAmt || q.xp) : 0;
        if(q.missDate !== t){ q.missDate = null; q.missAmt = 0; }
      });
      if(k.jokerDate !== t){ k.jokerDate = null; k.jokerAmt = 0; }
    });
    if(S.selDate === S.lastDate) S.selDate = t;
    S.lastDate = t;
    save();
  }
  var monD = weekMonday();
  var mon = dateStr(monD);
  var sunD = new Date(monD.getFullYear(), monD.getMonth(), monD.getDate()+6);
  S.kids.forEach(function(k){
    k.quests.forEach(function(q){
      q.week = (q.week||[]).filter(function(d){ return d >= mon && d <= dateStr(sunD); });
    });
    for(var d=0; d<7; d++){
      (k.sched[d]||[]).forEach(function(it){ if(!it.id) it.id = uid(); });
    }
  });
}
function activeQuests(k){
  var di = dayIdxMon();
  return k.quests.filter(function(q){ return (q.days||[]).indexOf(di) >= 0; });
}
function restQuests(k){
  var di = dayIdxMon();
  return k.quests.filter(function(q){ return (q.days||[]).indexOf(di) < 0; });

function schedTodayHTML(k){
  var di = dayIdxMon(), tds = todayStr();

  var rows = [];
  /* 1) 일반 주간 시간표 */
  (k.sched[di]||[]).forEach(function(it){
    rows.push({s:it.s||"", e:it.e||"", l:it.l, kind:"tt"});
  });
  /* 2) 오늘 날짜에 잡힌 특별 일정 (가족 = 둘 다, 아준/서준 = 해당 아이만) */
  eventsFor(tds, k).forEach(function(ev){
    rows.push({s:ev.time||"", e:"", l:ev.title, kind:"ev", who:ev.who});
  });
  /* 3) 날짜가 오늘인 D-Day */
  ddaysOn(tds).forEach(function(dd){
    rows.push({s:"", e:"", l:dd.title, kind:"dday"});
  });

  rows.sort(function(a,b){
    if(a.s !== b.s) return a.s < b.s ? -1 : 1;
    var ord = {dday:0, ev:1, tt:2};
    return ord[a.kind] - ord[b.kind];

/* ---------- XP & 퀘스트 로직 ---------- */
function addXp(k, delta){
  var before = levelForXp(k.xp);
  k.xp = Math.max(0, k.xp + delta);
  var after = levelForXp(k.xp);
  if(after > k.maxLevel) k.maxLevel = after;
  if(after > before) celebrate(k.id, after);
  return after > before;
}
/* 감점: 0 밑으로 내려가지 않는 선에서 실제로 깎인 XP를 돌려줌 */
function deductXp(k, amt){
  if(!amt || amt <= 0) return 0;
  var before = k.xp;
  k.xp = Math.max(0, k.xp - amt);
  return before - k.xp;
}
/* 미완료 감점액 = 퀘스트 XP의 절반 (10→5, 15→8, 5→3) */
function missAmount(q){ return Math.round((q.xp||0)/2); }
function missedToday(k){
  var t = todayStr();
  return activeQuests(k).filter(function(q){ return q.missDate === t; });
}
/* 오늘 순점수 = 오늘 체크(+) − 오늘 미완료 감점(−) (+ 오늘 조커 보너스) */
function todayNet(k){
  var t = todayStr(), net = 0;
  (k.quests||[]).forEach(function(q){
    if(q.done && q.doneDate === t) net += (q.doneAmt==null ? q.xp : q.doneAmt);
    if(q.missDate === t) net -= (q.missAmt || 0);
  });
  if(k.jokerDate === t) net += (k.jokerAmt==null ? 30 : k.jokerAmt);
  return net;
}
function todayNetLabel(k){
  var n = todayNet(k);
  return { n:n, cls:(n>0?"pos":n<0?"neg":"zero"),
    txt:(n>0 ? "오늘 +"+won(n)+" XP" : n<0 ? "오늘 −"+won(-n)+" XP" : "오늘 0 XP") };
}
function grantJoker(k){
  var t = todayStr();
  if(k.jokerDate === t) return false;
  k.jokerDate = t; k.jokerAmt = 30;
  addXp(k, 30);
  jokerToast(k.id);
  return true;
}
function revokeJoker(k){
  var t = todayStr();
  if(k.jokerDate !== t) return 0;
  var back = deductXp(k, (k.jokerAmt==null ? 30 : k.jokerAmt));
  k.jokerDate = null; k.jokerAmt = 0;
  return back;
}
/* 올클리어(미완료 없음)일 때만 조커 +30 */
function maybeJoker(k){
  var t = todayStr();
  if(k.jokerDate === t) return false;
  var act = activeQuests(k);
  if(!act.length) return false;
  if(!act.every(function(x){ return x.done; })) return false;
  if(missedToday(k).length) return false;
  return grantJoker(k);
}
function toggleQuest(k, q){
  var t = todayStr();
  if(q.done){
    q.done = false; q.doneDate = null;
    q.week = (q.week||[]).filter(function(d){ return d!==t; });
    deductXp(k, q.doneAmt==null ? q.xp : q.doneAmt);
    q.doneAmt = 0;
    revokeJoker(k); /* 더 이상 올클리어가 아니면 조커 보너스도 회수 */
  }else{
    if(q.missDate === t){ /* 미완료 → 완료: 감점했던 만큼 되돌리고 XP 적립 */
      if(q.missAmt) addXp(k, q.missAmt);
      q.missDate = null; q.missAmt = 0;
    }
    q.done = true; q.doneDate = t;
    if((q.week||[]).indexOf(t)<0) q.week.push(t);
    addXp(k, q.xp);
    q.doneAmt = q.xp;
    maybeJoker(k);
  }
  save(); renderKid(k); renderStandby();
}
/* 미완료(−) 버튼: 누르면 절반 감점, 다시 누르면 깎였던 만큼 정확히 복구 */
function missQuest(k, q){
  var t = todayStr();
  if(q.missDate === t){
    if(q.missAmt) addXp(k, q.missAmt);
    q.missDate = null; q.missAmt = 0;
    maybeJoker(k);
  }else{
    if(q.done){ /* 완료와 미완료는 배타적 — 완료 해제 후 감점 */
      q.done = false; q.doneDate = null;
      q.week = (q.week||[]).filter(function(d){ return d!==t; });
      deductXp(k, q.doneAmt==null ? q.xp : q.doneAmt);
      q.doneAmt = 0;
    }
    q.missAmt = deductXp(k, missAmount(q)); /* 실제로 깎인 XP 기록(하한 0) */
    q.missDate = t;
    revokeJoker(k); /* 미완료가 하나라도 있으면 조커 보너스 없음 */
  }
  save(); renderKid(k); renderStandby();
}
function resetDay(k){
  var t = todayStr();
  k.quests.forEach(function(q){
    if(q.done){
      q.done = false; q.doneDate = null;
      q.week = (q.week||[]).filter(function(d){ return d!==t; });
    }
    q.doneAmt = 0;
    if(q.missDate === t){ q.missDate = null; q.missAmt = 0; }
  });
  k.jokerDate = null; k.jokerAmt = 0;
  save(); renderKid(k); renderStandby();
}

/* ---------- 이벤트 위임 ---------- */
document.addEventListener("click", function(e){
  var el = e.target.closest("[data-act]");
  if(!el) return;
  var act = el.dataset.act;
  var kid = el.dataset.kid ? S.kids.find(function(x){ return x.id===el.dataset.kid; }) : null;

  switch(act){
    case "cal-prev": S.calM--; if(S.calM<0){S.calM=11;S.calY--;} save(); renderCal(); break;
    case "cal-next": S.calM++; if(S.calM>11){S.calM=0;S.calY++;} save(); renderCal(); break;
    case "cal-today": S.calY=new Date().getFullYear(); S.calM=new Date().getMonth(); S.selDate = todayStr(); save(); renderCal(); break;
    case "cal-select": {
      if(!el.dataset.date) return;
      S.selDate = el.dataset.date;
      var sd = parseDate(S.selDate);
      S.calY = sd.getFullYear(); S.calM = sd.getMonth();
      save(); renderCal(); break;
    }
    case "ev-add": {
      var evT = document.getElementById("ev-title");
      if(!evT) return;
      var evTitle = evT.value.trim();
      if(!evTitle){ evT.focus(); return; }
      var evWho = document.getElementById("ev-who").value || "가족";
      var evTime = document.getElementById("ev-time").value || "";
      var evDate = S.selDate || todayStr();
      S.evWho = evWho;
      S.events = S.events || [];
      S.events.push({id:uid(), date:evDate, who:evWho, time:evTime, title:evTitle});
      save(); renderCal(); S.kids.forEach(renderKid); renderStandby(); break;
    }
    case "ev-del": {
      S.events = (S.events||[]).filter(function(x){ return x.id!==el.dataset.id; });
      save(); renderCal(); S.kids.forEach(renderKid); renderStandby(); break;
    }

    case "dday-add": {
      var tt = document.getElementById("dday-title"), td = document.getElementById("dday-date");
      var title = tt.value.trim();
      if(!title){ tt.focus(); return; }
      if(!td.value){ td.focus(); return; }
      S.ddys.push({id:uid(), title:title, date:td.value});
      save(); renderCal(); S.kids.forEach(renderKid); renderStandby(); break;
    }
    case "dday-del":
      S.ddys = S.ddys.filter(function(d){ return d.id!==el.dataset.id; });
      save(); renderCal(); S.kids.forEach(renderKid); renderStandby(); break;

    case "rank-open": renderRankTable(); document.getElementById("modal-rank").classList.remove("hidden"); break;
    case "rank-close": document.getElementById("modal-rank").classList.add("hidden"); break;

    case "tt-open":
      ui.ttKid = el.dataset.id; ui.ttDay = dayIdxMon();
      renderTT(); document.getElementById("modal-tt").classList.remove("hidden"); break;
    case "tt-close": document.getElementById("modal-tt").classList.add("hidden"); break;
    case "tt-tab": ui.ttDay = +el.dataset.day; renderTT(); break;
    case "tt-add": {
      var s = document.getElementById("tt-s").value || "00:00";
      var ev = document.getElementById("tt-e").value || "";
      var l = document.getElementById("tt-l").value.trim();
      if(!l){ document.getElementById("tt-l").focus(); return; }
      var arr = kid.sched[ui.ttDay] = kid.sched[ui.ttDay]||[];
      arr.push({id:uid(), s:s, e:ev, l:l});
      arr.sort(function(a,b){ return a.s<b.s?-1:1; });
      save(); renderTT(); renderKid(kid); renderStandby(); break;
    }
    case "tt-del": {
      var arr2 = kid.sched[+el.dataset.day] = kid.sched[+el.dataset.day]||[];
      kid.sched[+el.dataset.day] = arr2.filter(function(x){ return x.id!==el.dataset.tid; });
      save(); renderTT(); renderKid(kid); break;
    }

    case "standby-open": document.getElementById("standby").classList.remove("hidden"); renderStandby(); break;
    case "standby-close": document.getElementById("standby").classList.add("hidden"); break;

    case "q-toggle": {
      var q = kid.quests.find(function(x){ return x.id===el.dataset.qid; });
      if(q) toggleQuest(kid, q);
      break;
    }
    case "q-miss": {
      var qm = kid.quests.find(function(x){ return x.id===el.dataset.qid; });
      if(qm) missQuest(kid, qm);
      break;
    }
    case "q-del":
      kid.quests = kid.quests.filter(function(x){ return x.id!==el.dataset.qid; });
      save(); renderKid(kid); renderStandby(); break;
    case "q-reset": resetDay(kid); break;
    case "q-set": {
      var qid = el.dataset.qid;
      ui.openSettings[qid] = !ui.openSettings[qid];
      renderKid(kid); break;
    }
    case "q-day": {
      var qq = kid.quests.find(function(x){ return x.id===el.dataset.qid; });
      if(!qq) return;
      var dd = +el.dataset.day;
      var ix = qq.days.indexOf(dd);
      if(ix>=0){ if(qq.days.length>1) qq.days.splice(ix,1); }
      else qq.days.push(dd);
      qq.days.sort(function(a,b){ return a-b; });
      save(); renderKid(kid); break;
    }
    case "q-add": {
      var inp = document.getElementById("q-title-"+kid.id);
      var xpSel = document.getElementById("q-xp-"+kid.id);
      var goalSel = document.getElementById("q-goal-"+kid.id);
      var v = inp.value.trim();
      if(!v){ inp.focus(); return; }
      kid.quests.push(Q(v, +xpSel.value, allDays(), +goalSel.value));
      save(); renderKid(kid); break;
    }

    case "wish-add": {
      var wt = document.getElementById("wish-title");
      var v2 = wt.value.trim();
      if(!v2){ wt.focus(); return; }
      S.wish.push({id:uid(), title:v2, who:document.getElementById("wish-who").value,
        memo:document.getElementById("wish-memo").value.trim(), done:false});
      save(); renderWish(); break;
    }
    case "wish-toggle": {
      var w = S.wish.find(function(x){ return x.id===el.dataset.id; });
      if(w){ w.done = !w.done; save(); renderWish(); }
      break;
    }
    case "wish-del":
      S.wish = S.wish.filter(function(x){ return x.id!==el.dataset.id; });
      save(); renderWish(); break;
  }
});
/* select(주간 목표) 변경 이벤트 */
document.addEventListener("change", function(e){
  var el = e.target;
  if(el.dataset && el.dataset.act === "q-goal"){
    var k = S.kids.find(function(x){ return x.id===el.dataset.kid; });
    var q = k && k.quests.find(function(x){ return x.id===el.dataset.qid; });
    if(q){ q.goal = +el.value; save(); renderKid(k); }
  }
});
/* 퀘스트 입력창에서 Enter */
document.addEventListener("keydown", function(e){
  if(e.key==="Enter" && e.target && e.target.id && e.target.id.indexOf("q-title-")===0){
    var kidId = e.target.id.slice(8);
    var btn = document.querySelector('[data-act="q-add"][data-kid="'+kidId+'"]');
    if(btn) btn.click();
  }
  if(e.key==="Enter" && e.target && e.target.id==="dday-title"){
    var b = document.querySelector('[data-act="dday-add"]');
    if(b) b.click();
  }
  if(e.key==="Enter" && e.target && e.target.id==="ev-title"){
    var b3 = document.querySelector('[data-act="ev-add"]');
    if(b3) b3.click();
  }
  if((e.key==="Enter" || e.key===" ") && e.target && e.target.dataset && e.target.dataset.act==="cal-select"){
    e.preventDefault();
    e.target.click();
  }
  if(e.key==="Enter" && e.target && e.target.id==="wish-title"){
    var b2 = document.querySelector('[data-act="wish-add"]');
    if(b2) b2.click();
  }
  if(e.key==="Escape"){
    document.getElementById("modal-rank").classList.add("hidden");
    document.getElementById("modal-tt").classList.add("hidden");
  }
});

/* ---------- 시계 틱: 날짜 바뀌면 하루 초기화 ---------- */
function tick(){
  renderClock();
  var t = todayStr();
  if(S.lastDate !== t){ normalizeDay(); renderAll(); }
  renderStandby();
}

/* ---------- 초기화 ---------- */
function renderAll(){
  renderCal(); renderWish();
  S.kids.forEach(renderKid);
  renderStandby();
}
(function init(){
  S = load();
  if(!S){
    S = defaultState();
    S.ddys = sampleDdays();
    save();
  }else{
    S = migrate(S);
    save();
  }
  /* 기존 저장본과의 호환: 누락 필드 채우기 */
  S.kids.forEach(function(k){
    k.maxLevel = k.maxLevel || levelForXp(k.xp);
    if(k.jokerDate === todayStr()){ if(k.jokerAmt==null) k.jokerAmt = 30; }
    else { k.jokerAmt = k.jokerAmt || 0; }
    (k.quests||[]).forEach(function(q){
      q.week = q.week||[]; q.days = q.days||allDays(); q.goal = q.goal||7;
      if(q.missDate === undefined) q.missDate = null;
      if(q.missAmt === undefined) q.missAmt = 0;
      if(q.doneAmt === undefined) q.doneAmt = (q.done && q.doneDate===todayStr()) ? q.xp : 0;
    });
    k.sched = k.sched || {};
    for(var d=0; d<7; d++) k.sched[d] = k.sched[d]||[];
  });
  /* 날짜별 특별 일정(events)·선택 날짜는 기존 저장본에 없으면 빈 값으로 보충 (기존 데이터는 그대로) */
  if(!Array.isArray(S.events)) S.events = [];
  S.events = S.events.filter(function(ev){ return ev && ev.date && ev.title; });
  S.events.forEach(function(ev){
    if(!ev.id) ev.id = uid();
    if(!ev.who) ev.who = "가족";
    if(ev.time == null) ev.time = "";
  });
  if(!S.evWho) S.evWho = "가족";
  if(!S.selDate) S.selDate = todayStr();
  if(!S.ddys) S.ddys = [];
  save();
  normalizeDay();
  renderAll();
  renderClock();
  setInterval(tick, 1000);
  document.addEventListener("visibilitychange", function(){ if(!document.hidden) tick(); });
})();
</script>
